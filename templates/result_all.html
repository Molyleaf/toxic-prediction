<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Results (All Models)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="mdl-card mdl-shadow--6dp main-card">
    <div class="mdl-card__title">
      <h2 class="mdl-card__title-text">Prediction Results (All Models)</h2>
    </div>
    <div class="mdl-card__supporting-text">
      <p>基于提交的数据，以下为各模型的预测结果：</p>
      <div class="results-table-wrapper">
        <table class="mdl-data-table mdl-js-data-table mdl-shadow--2dp full-width">
          <thead>
            <tr>
              <th class="mdl-data-table__cell--non-numeric">Model</th>
              <th class="mdl-data-table__cell--non-numeric">Prediction</th>
              <th>Prob. Toxic</th>
              <th>Prob. Non-Toxic</th>
            </tr>
          </thead>
          <tbody>
            {% for r in results %}
            <tr>
              <td class="mdl-data-table__cell--non-numeric">{{ r.model_name }}</td>
              <td class="mdl-data-table__cell--non-numeric">
                <span class="badge {{ 'toxic' if r.label == 'Toxic' else 'nontoxic' }}">{{ r.label }}</span>
              </td>
              <td>{{ (r.proba_toxic * 100) | round(2) }}%</td>
              <td>{{ (r.proba_nontoxic * 100) | round(2) }}%</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    <div class="mdl-card__actions mdl-card--border">
      <a href="/" class="mdl-button mdl-button--colored mdl-js-button mdl-js-ripple-effect">
        Return
      </a>
    </div>
  </div>
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
</body>
</html>
