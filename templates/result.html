<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediction Result</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
	<script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="mdl-card mdl-shadow--6dp main-card">
        <div class="mdl-card__title">
          <h2 class="mdl-card__title-text">Prediction Result</h2>
        </div>
        <div class="mdl-card__supporting-text">
          <p>Based on the data you provided, the prediction result is:</p>
          <div class="result-text {{ 'toxic' if 'Toxic' in prediction else 'nontoxic' }}">
            {{ 'Toxic' if 'Toxic' in prediction else 'Non-Toxic' }}
          </div>
          <div style="margin-top: 8px; color:#555;">
            <p style="margin: 4px 0;">Probability (Toxic): <strong>{{ (proba_toxic * 100) | round(2) }}%</strong></p>
            <p style="margin: 4px 0;">Probability (Non-Toxic): <strong>{{ (proba_nontoxic * 100) | round(2) }}%</strong></p>
          </div>
        </div>
        <div class="mdl-card__actions mdl-card--border">
          <a href="{{ url_for('index') }}" class="mdl-button mdl-button--colored mdl-js-button mdl-js-ripple-effect">
            Return
          </a>
        </div>
      </div>
</body>
</html>
